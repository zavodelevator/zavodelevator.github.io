<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ремонт шнека</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="css/calc.css">
  <link rel="icon" href="https://fonts.gstatic.com/s/i/materialiconsoutlined/home/v6/24px.svg">
</head>
<body>
  <!-- NAV:START -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="index.html">Agrohelix · калькулятори</a>
    <ul class="navbar-nav flex-row flex-wrap">
      <li class="nav-item mr-3 active"><a class="nav-link" href="repair.html">Ремонт шнека</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="screw.html">Шнековий транспортер</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="noria.html">Норія</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="tsh.html">ТШ</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="spiral.html">Спіраль</a></li>
    </ul>
  </nav>
  <!-- NAV:END -->

  <div class="container">
    <div class="card">
      <div class="card-header">Ремонт шнека</div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-4">
            <form id="inputs">
              <div class="form-group">
                <label for="D">Зовнішній діаметр спіралі D, мм</label>
                <input type="number" step="any" class="form-control" id="D" name="D" value="110">
              </div>
              <div class="form-group">
                <label for="d">Діаметр труби/вала d, мм</label>
                <input type="number" step="any" class="form-control" id="d" name="d" value="42">
              </div>
              <div class="form-group">
                <label for="p">Крок спіралі p, мм</label>
                <input type="number" step="any" class="form-control" id="p" name="p" value="110">
              </div>
              <div class="form-group">
                <label for="s">Товщина штрипса s, мм</label>
                <input type="number" step="any" class="form-control" id="s" name="s" value="5">
              </div>
              <div class="form-group">
                <label for="L">Довжина шнека L, м</label>
                <input type="number" step="any" class="form-control" id="L" name="L" value="2.3">
              </div>
              <div class="form-group">
                <label for="owner">Труба</label>
                <select class="form-control" id="owner" name="owner">
                  <option value="hzett">Нова (ХЗЕТТ)</option>
                  <option value="customer">Замовника (знімаємо стару спіраль)</option>
                </select>
              </div>
              <div class="form-group">
                <label for="wall">Товщина стінки труби, мм</label>
                <input type="number" step="any" class="form-control" id="wall" name="wall" value="6">
              </div>
            </form>
          </div>
          <div class="col-md-8" id="result"><div class="text-muted">Завантаження…</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- PANEL:START -->
  <button type="button" class="btn btn-primary panel-toggle" id="panel-open">⚙ Параметри</button>
  <aside id="panel" aria-label="Параметри розрахунку">
    <div class="panel-head">
      <strong>Параметри</strong>
      <div>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="panel-reset" title="Повернути значення з JSON">Скинути</button>
        <button type="button" class="btn btn-sm btn-outline-dark" id="panel-close">✕</button>
      </div>
    </div>
    <div class="small text-muted px-3 pt-2">Зміни діють лише на поточний розрахунок. Постійні ціни — у файлах <code>calc/data/*.json</code>.</div>
    <div id="panel-body"></div>
  </aside>
  <!-- PANEL:END -->

  <script src="js/core.js"></script>
  <script src="js/repair.js"></script>
</body>
</html>
