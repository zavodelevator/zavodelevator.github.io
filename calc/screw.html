<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Шнековий транспортер</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="css/calc.css">
  <link rel="icon" href="https://fonts.gstatic.com/s/i/materialiconsoutlined/home/v6/24px.svg">
</head>
<body>
  <!-- NAV:START -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="index.html">Agrohelix · калькулятори</a>
    <ul class="navbar-nav flex-row flex-wrap">
      <li class="nav-item mr-3"><a class="nav-link" href="repair.html">Ремонт шнека</a></li>
      <li class="nav-item mr-3 active"><a class="nav-link" href="screw.html">Шнековий транспортер</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="noria.html">Норія</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="tsh.html">ТШ</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="spiral.html">Спіраль</a></li>
    </ul>
  </nav>
  <!-- NAV:END -->

  <div class="container">
    <div class="card">
      <div class="card-header">Транспортер шнековий</div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-4 col-lg-4">
            <form id="inputs" autocomplete="off">
              <div class="form-group">
                <div class="btn-group btn-group-toggle w-100" role="group" data-toggle-group="type">
                  <label class="btn btn-outline-primary active"><input type="radio" name="type" value="tube" checked> Труба</label>
                  <label class="btn btn-outline-primary"><input type="radio" name="type" value="trough"> Жолоб</label>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="size">Типорозмір, мм</label>
                  <select class="form-control" id="size" name="size"></select>
                </div>
                <div class="form-group col-6">
                  <label for="length">Довжина L, м</label>
                  <input type="number" step="any" class="form-control" id="length" name="length" value="6">
                </div>
              </div>
              <div class="form-group">
                <label for="preset">Виконання (метал)</label>
                <select class="form-control" id="preset" name="preset"></select>
              </div>
              <div class="form-row">
                <div class="form-group col-7">
                  <label for="profile">Продукт</label>
                  <select class="form-control" id="profile" name="profile"></select>
                </div>
                <div class="form-group col-5">
                  <label for="slope">Нахил, °</label>
                  <input type="number" step="any" min="0" max="20" class="form-control" id="slope" name="slope" value="0">
                </div>
              </div>
              <div class="form-row">
                <div class="form-group col-7">
                  <label for="drive">Привід</label>
                  <select class="form-control" id="drive" name="drive">
                    <option value="gear">Мотор-редуктор</option>
                    <option value="motor">Двигун + ремінь</option>
                    <option value="none">Без приводу</option>
                  </select>
                </div>
                <div class="form-group col-5">
                  <label for="kw">кВт</label>
                  <select class="form-control" id="kw" name="kw"></select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group col-4">
                  <label for="hopper">Бункер, м³</label>
                  <input type="number" step="any" min="0" class="form-control" id="hopper" name="hopper" value="0" title="0 — без бункера">
                </div>
                <div class="form-group col-4">
                  <label for="krot">Крот, м</label>
                  <input type="number" step="any" min="0" class="form-control" id="krot" name="krot" value="0" title="Довжина відкритої приймальної частини; 0 — без крота">
                </div>
                <div class="form-group col-4">
                  <label for="stand">Опора</label>
                  <select class="form-control" id="stand" name="stand">
                    <option value="none">—</option>
                    <option value="stand">Підставка</option>
                    <option value="chassis">Шасі</option>
                  </select>
                </div>
              </div>
              <div class="form-row" id="chassis-fields" hidden>
                <div class="form-group col-8">
                  <label for="wheels">Колеса</label>
                  <select class="form-control" id="wheels" name="wheels"></select>
                </div>
                <div class="form-group col-4 d-flex align-items-end">
                  <div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="winch" name="winch"><label class="form-check-label" for="winch">Лебідка</label></div>
                </div>
              </div>

              <div class="form-group">
                <label class="d-block">Ціна</label>
                <div class="btn-group btn-group-toggle w-100" role="group" data-toggle-group="mode">
                  <label class="btn btn-outline-success active"><input type="radio" name="mode" value="simple" checked> Простий</label>
                  <label class="btn btn-outline-success"><input type="radio" name="mode" value="sections"> За секціями</label>
                  <label class="btn btn-outline-success"><input type="radio" name="mode" value="detailed"> Детальний</label>
                </div>
              </div>

              <details class="mb-3">
                <summary class="label-title">Додатково (спіраль, крок, продуктивність)</summary>
                <div class="form-row mt-2">
                  <div class="form-group col-6">
                    <label for="flight_tech">Спіраль</label>
                    <select class="form-control" id="flight_tech" name="flight_tech">
                      <option value="solid">Цільнотягнута</option>
                      <option value="segment">Сегменти</option>
                    </select>
                  </div>
                  <div class="form-group col-6">
                    <label for="pitch_ratio">Крок, × D</label>
                    <input type="number" step="any" class="form-control" id="pitch_ratio" name="pitch_ratio" placeholder="1,0">
                  </div>
                  <div class="form-group col-6">
                    <label for="q">Потрібно, т/год</label>
                    <input type="number" step="any" class="form-control" id="q" name="q" placeholder="макс.">
                  </div>
                  <div class="form-group col-6">
                    <label for="price_type">Тип ціни</label>
                    <select class="form-control" id="price_type" name="price_type">
                      <option value="retail">Роздріб</option>
                      <option value="wholesale">Опт</option>
                    </select>
                  </div>
                </div>
              </details>
            </form>
          </div>
          <div class="col-md-8"><div id="viz"></div><div id="result"><div class="text-muted">Завантаження…</div></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- PANEL:START -->
  <button type="button" class="btn btn-primary panel-toggle" id="panel-open">⚙ Параметри</button>
  <aside id="panel" aria-label="Параметри розрахунку">
    <div class="panel-head">
      <strong>Параметри</strong>
      <div>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="panel-reset" title="Повернути значення з JSON">Скинути</button>
        <button type="button" class="btn btn-sm btn-outline-dark" id="panel-close">✕</button>
      </div>
    </div>
    <div class="small text-muted px-3 pt-2">Зміни діють лише на поточний розрахунок. Постійні ціни — у файлах <code>calc/data/*.json</code>.</div>
    <div id="panel-body"></div>
  </aside>
  <!-- PANEL:END -->

  <script src="js/core.js"></script>
  <script src="js/shnek_core.js"></script>
  <script src="js/screw.js"></script>
</body>
</html>
