<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Норія ковшова</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="css/calc.css">
  <link rel="icon" href="https://fonts.gstatic.com/s/i/materialiconsoutlined/home/v6/24px.svg">
</head>
<body>
  <!-- NAV:START -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="index.html">Agrohelix · калькулятори</a>
    <ul class="navbar-nav flex-row flex-wrap">
      <li class="nav-item mr-3"><a class="nav-link" href="repair.html">Ремонт шнека</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="screw.html">Шнековий транспортер</a></li>
      <li class="nav-item mr-3 active"><a class="nav-link" href="noria.html">Норія</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="tsh.html">ТШ</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="belt.html">Стрічковий</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="sklad_spiral.html">Склад спіралей</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="prices.html" title="Ціни">⚙ Ціни</a></li>
    </ul>
  </nav>
  <!-- NAV:END -->

  <div class="container">
    <div class="card">
      <div class="card-header d-flex flex-wrap justify-content-between"><span>Норія ковшова</span><span class="small text-muted" id="price-file"></span></div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-4 col-lg-4">
            <form id="inputs" autocomplete="off">
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="capacity">Норія НКЗ</label>
                  <select class="form-control" id="capacity" name="capacity"></select>
                </div>
                <div class="form-group col-6">
                  <label for="height">Висота H, м</label>
                  <input type="number" step="any" class="form-control" id="height" name="height" value="12" title="Загальна висота: від низу башмака до верху головки">
                </div>
              </div>
              <div class="form-group">
                <div class="btn-group btn-group-toggle w-100" role="group" data-toggle-group="conv">
                  <label class="btn btn-outline-primary active"><input type="radio" name="conv" value="belt" checked> Стрічкова</label>
                  <label class="btn btn-outline-primary" id="conv-chain-btn"><input type="radio" name="conv" value="chain"> Ланцюгова</label>
                </div>
              </div>
              <div class="form-group" id="belt-group">
                <label for="belt">Стрічка</label>
                <select class="form-control" id="belt" name="belt"></select>
              </div>
              <div class="form-group">
                <label for="bucket">Ківш</label>
                <select class="form-control" id="bucket" name="bucket"></select>
              </div>
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="thick">Шахта, товщина</label>
                  <select class="form-control" id="thick" name="thick"></select>
                </div>
                <div class="form-group col-6">
                  <label for="coupling">З'єднувальна муфта</label>
                  <select class="form-control" id="coupling" name="coupling"></select>
                </div>
              </div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="lagging" name="lagging" checked><label class="form-check-label" for="lagging">Футування привідного барабана</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="backstop" name="backstop"><label class="form-check-label" for="backstop">Муфта зворотного ходу</label></div>
              <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="sensors" name="sensors"><label class="form-check-label" for="sensors">Датчики (обертів, підпору<span id="sensor-belt">, сходу стрічки</span>)</label></div>
              <div class="form-group">
                <label for="motor">Мотор-редуктор <span class="label-title" id="kw-hint"></span></label>
                <select class="form-control" id="motor" name="motor"></select>
              </div>
            </form>
          </div>
          <div class="col-md-8"><div id="viz"></div><div id="result"><div class="text-muted">Завантаження…</div></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- PANEL:START -->
  <button type="button" class="btn btn-primary panel-toggle" id="panel-open">⚙ Параметри</button>
  <aside id="panel" aria-label="Параметри розрахунку">
    <div class="panel-head">
      <strong>Параметри</strong>
      <div>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="panel-reset" title="Повернути значення з JSON">Скинути</button>
        <button type="button" class="btn btn-sm btn-outline-dark" id="panel-close">✕</button>
      </div>
    </div>
    <div class="small text-muted px-3 pt-2">Зміни діють лише на поточний розрахунок. Постійні ціни — у файлах <code>calc/data/*.json</code>.</div>
    <div id="panel-body"></div>
  </aside>
  <!-- PANEL:END -->

  <script src="js/data_bundle.js"></script>
  <script src="js/prices.js"></script>
  <script src="js/core.js"></script>
  <script src="js/noria.js"></script>
</body>
</html>
