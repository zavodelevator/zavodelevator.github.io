<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Скребковий транспортер ТШ</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="css/calc.css">
  <link rel="icon" href="https://fonts.gstatic.com/s/i/materialiconsoutlined/home/v6/24px.svg">
</head>
<body>
  <!-- NAV:START -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="index.html">Agrohelix · калькулятори</a>
    <ul class="navbar-nav flex-row flex-wrap">
      <li class="nav-item mr-3"><a class="nav-link" href="repair.html">Ремонт шнека</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="screw.html">Шнековий транспортер</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="noria.html">Норія</a></li>
      <li class="nav-item mr-3 active"><a class="nav-link" href="tsh.html">ТШ</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="belt.html">Стрічковий</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="spiral.html">Спіраль</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="sklad_spiral.html">Склад спіралей</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="prices.html" title="Ціни">⚙ Ціни</a></li>
    </ul>
  </nav>
  <!-- NAV:END -->

  <div class="container">
    <div class="card">
      <div class="card-header d-flex flex-wrap justify-content-between"><span>Транспортер скребковий (ТШ)</span><span class="small text-muted" id="price-file"></span></div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-4 col-lg-4">
            <form id="inputs" autocomplete="off">
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="model">Модель</label>
                  <select class="form-control" id="model" name="model"></select>
                </div>
                <div class="form-group col-6">
                  <label for="length">Довжина L, м</label>
                  <input type="number" step="any" class="form-control" id="length" name="length" value="10">
                </div>
              </div>
              <div class="form-group">
                <label for="chain">Ланцюг і шкребки</label>
                <select class="form-control" id="chain" name="chain"></select>
              </div>
              <div class="form-group">
                <label for="liner">Футування короба</label>
                <select class="form-control" id="liner" name="liner">
                  <option value="none">Без футування</option>
                  <option value="pe500">Пластик ПЕ-500</option>
                  <option value="pe1000">Пластик ПЕ-1000</option>
                </select>
              </div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="distributor" name="distributor"><label class="form-check-label" for="distributor">Розподільний механізм <span class="label-title">(транспортер у завальній ямі)</span></label></div>
              <div class="form-row mt-1" id="distrib-fields" hidden>
                <div class="form-group col-6">
                  <label for="distributor_length">Довжина, м <span class="label-title">(1–10)</span></label>
                  <input type="number" step="any" min="1" max="10" class="form-control" id="distributor_length" name="distributor_length" value="4">
                </div>
                <div class="form-group col-6">
                  <label class="label-title">Ціна за 1 м</label>
                  <div class="form-control-plaintext font-weight-bold" id="distrib-price"></div>
                </div>
              </div>
              <div class="form-group">
                <label for="motor">Мотор-редуктор</label>
                <select class="form-control" id="motor" name="motor"></select>
              </div>
            </form>
          </div>
          <div class="col-md-8"><div id="viz"></div><div id="result"><div class="text-muted">Завантаження…</div></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- PANEL:START -->
  <button type="button" class="btn btn-primary panel-toggle" id="panel-open">⚙ Параметри</button>
  <aside id="panel" aria-label="Параметри розрахунку">
    <div class="panel-head">
      <strong>Параметри</strong>
      <div>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="panel-reset" title="Повернути значення з JSON">Скинути</button>
        <button type="button" class="btn btn-sm btn-outline-dark" id="panel-close">✕</button>
      </div>
    </div>
    <div class="small text-muted px-3 pt-2">Зміни діють лише на поточний розрахунок. Постійні ціни — у файлах <code>calc/data/*.json</code>.</div>
    <div id="panel-body"></div>
  </aside>
  <!-- PANEL:END -->

  <script src="js/prices.js"></script>
  <script src="js/core.js"></script>
  <script src="js/tsh.js"></script>
</body>
</html>
