<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Спіраль цільнотягнута</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="css/calc.css">
  <link rel="icon" href="https://fonts.gstatic.com/s/i/materialiconsoutlined/home/v6/24px.svg">
</head>
<body>
  <!-- NAV:START -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="index.html">Agrohelix · калькулятори</a>
    <ul class="navbar-nav flex-row flex-wrap">
      <li class="nav-item mr-3"><a class="nav-link" href="repair.html">Ремонт шнека</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="screw.html">Шнековий транспортер</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="noria.html">Норія</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="tsh.html">ТШ</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="belt.html">Стрічковий</a></li>
      <li class="nav-item mr-3 active"><a class="nav-link" href="spiral.html">Спіраль</a></li>
      <li class="nav-item mr-3"><a class="nav-link" href="sklad_spiral.html">Склад спіралей</a></li>
    </ul>
  </nav>
  <!-- NAV:END -->

  <div class="container">
    <div class="card">
      <div class="card-header">Спіраль шнекова (цільнотягнута / сегменти)</div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-4 col-lg-4">
            <form id="inputs" autocomplete="off">
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="D">Зовнішній D, мм</label>
                  <input type="number" step="any" class="form-control" id="D" name="D" value="110">
                </div>
                <div class="form-group col-6">
                  <label for="d">Внутрішній d, мм</label>
                  <input type="number" step="any" class="form-control" id="d" name="d" value="42">
                </div>
                <div class="form-group col-6">
                  <label for="p">Крок, мм <span class="label-title" id="p-hint">= D</span></label>
                  <input type="number" step="any" class="form-control" id="p" name="p" value="110" title="За замовчуванням крок = D. Клікніть, щоб ввести свій.">
                </div>
                <div class="form-group col-6">
                  <label for="s">Товщина s, мм</label>
                  <input type="number" step="any" class="form-control" id="s" name="s" value="5">
                </div>
                <div class="form-group col-12">
                  <label for="L">Довжина спіралі, м</label>
                  <input type="number" step="any" class="form-control" id="L" name="L" value="1">
                </div>
              </div>
              <div class="form-group">
                <div class="btn-group btn-group-toggle w-100" role="group">
                  <label class="btn btn-outline-primary active"><input type="radio" name="kind" value="rolled" checked> Цільнотягнута</label>
                  <label class="btn btn-outline-primary"><input type="radio" name="kind" value="segments"> Сегменти</label>
                </div>
              </div>
              <div class="form-row" id="seg-fields" hidden>
                <div class="form-group col-6">
                  <label for="seg_qty">Сегментів, шт</label>
                  <input type="number" step="1" class="form-control" id="seg_qty" name="seg_qty" placeholder="авто">
                </div>
                <div class="form-group col-6">
                  <label for="seg_markup">Націнка, %</label>
                  <input type="number" step="any" class="form-control" id="seg_markup" name="seg_markup" value="0">
                </div>
              </div>
              <div class="form-group">
                <label for="grade">Метал (штрипс)</label>
                <select class="form-control" id="grade" name="grade"></select>
              </div>
              <div class="form-group">
                <div class="btn-group btn-group-toggle w-100" role="group">
                  <label class="btn btn-outline-success active"><input type="radio" name="price_type" value="retail" checked> Роздріб</label>
                  <label class="btn btn-outline-success"><input type="radio" name="price_type" value="wholesale"> Опт</label>
                </div>
              </div>
            </form>
          </div>
          <div class="col-md-8"><div id="viz"></div><div id="result"><div class="text-muted">Завантаження…</div></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- PANEL:START -->
  <button type="button" class="btn btn-primary panel-toggle" id="panel-open">⚙ Параметри</button>
  <aside id="panel" aria-label="Параметри розрахунку">
    <div class="panel-head">
      <strong>Параметри</strong>
      <div>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="panel-reset" title="Повернути значення з JSON">Скинути</button>
        <button type="button" class="btn btn-sm btn-outline-dark" id="panel-close">✕</button>
      </div>
    </div>
    <div class="small text-muted px-3 pt-2">Зміни діють лише на поточний розрахунок. Постійні ціни — у файлах <code>calc/data/*.json</code>.</div>
    <div id="panel-body"></div>
  </aside>
  <!-- PANEL:END -->

  <script src="js/core.js"></script>
  <script src="js/draw_screw.js"></script>
  <script src="js/spiral.js"></script>
</body>
</html>
